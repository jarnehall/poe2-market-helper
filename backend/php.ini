; Minimal php.ini for running this app's backend — the winget/zip PHP
; distribution for Windows ships without an active php.ini, so extensions
; (including curl, needed to fetch live league data from poe.ninja) are
; disabled by default. Loaded explicitly via `php -c backend/php.ini` in the
; npm scripts, rather than editing the machine-wide PHP install.
;
; extension_dir is relative ("ext") rather than an absolute path, since it
; resolves against the php.exe binary's own directory on Windows regardless
; of the current working directory or where PHP happens to be installed —
; this file works unmodified on any machine's PHP install.
extension_dir=ext
extension=curl
extension=openssl
