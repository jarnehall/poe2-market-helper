<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Jarnehall's market helper</title>
    <meta
      name="description"
      content="Track the best currency trades in Path of Exile 2 — live rates, trends, and volume across every league."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jarnehall's Market Helper" />
    <meta property="og:title" content="Jarnehall's Market Helper" />
    <meta
      property="og:description"
      content="Track the best currency trades in Path of Exile 2 — live rates, trends, and volume across every league."
    />
    <meta property="og:url" content="https://poe2.jarnehall.se/" />
    <meta property="og:image" content="https://poe2.jarnehall.se/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jarnehall's Market Helper" />
    <meta
      name="twitter:description"
      content="Track the best currency trades in Path of Exile 2 — live rates, trends, and volume across every league."
    />
    <meta name="twitter:image" content="https://poe2.jarnehall.se/og-image.jpg" />
    <!-- Mirrors src/index.css's --bg and body::before so the page looks the
         same before the app's stylesheet and data have loaded. Keep in sync.
         Always dark — this app doesn't have a light mode, regardless of the
         OS/browser color-scheme preference. -->
    <style>
      :root {
        --bg: #0d0d0c;
        color-scheme: dark;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 500px;
        z-index: -1;
        pointer-events: none;
        background-image:
          linear-gradient(to bottom, transparent 0%, var(--bg) 90%),
          url("/bg.webp");
        background-repeat: no-repeat, no-repeat;
        background-position:
          top center,
          top center;
        background-size:
          100% 100%,
          cover;
      }
      .loading-spinner {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-spinner::after {
        content: "";
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(201, 162, 39, 0.2);
        border-top-color: #c9a227;
        animation: loading-spinner-spin 0.8s linear infinite;
      }
      @keyframes loading-spinner-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-spinner" role="status" aria-label="Loading"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
